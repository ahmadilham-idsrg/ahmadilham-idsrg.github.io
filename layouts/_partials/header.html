<header class="header">
    <nav class="header-nav home-header-nav">
        <div class="logo home-logo">
            <a href="{{ "" | absLangURL }}" accesskey="h" title="{{ site.Params.label.text | default site.Title }} (Alt + H)">
                {{- $label_text := (site.Params.label.text | default site.Title) }}
                {{- $label_text -}}
            </a>
        </div>

        <ul id="menu" class="menu home-menu">
            {{- range site.Menus.main }}
                <li class="menu-item {{ .Identifier }}">
                    {{- if eq .Identifier "search" }}
                        <a class="home-search-link" href="{{ .URL | absLangURL }}" title="{{ .Title }}">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </a>
                    {{- else }}
                        <a href="{{ .URL | absLangURL }}" title="{{ .Title | default .Name }}">
                            {{ .Name }}
                        </a>
                    {{- end }}
                </li>
            {{- end }}
        </ul>
    </nav>
</header>
