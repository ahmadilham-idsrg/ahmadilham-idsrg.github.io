backend:
  name: github
  repo: ahmadilham-idsrg/ahmadilham-idsrg.github.io
  branch: main
  auth_scope: repo
  base_url: https://decap-oauth.ahmadilham.workers.dev
  auth_endpoint: /auth
  local_backend: true

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "content/_index.md"
        label: "Homepage"
        name: "homepage"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (subtitle hero)", name: "description", widget: "string" }
          - label: "Galeri Foto"
            name: "gallery"
            widget: "list"
            required: false
            fields:
              - { label: "Gambar", name: "image", widget: "image" }
              - { label: "Alt / keterangan", name: "alt", widget: "string", required: false }
          - label: "Logo Footer (kiri)"
            name: "footerLogosLeft"
            widget: "list"
            required: false
            fields:
              - { label: "Gambar", name: "image", widget: "image" }
              - { label: "Alt", name: "alt", widget: "string", required: false }
              - { label: "URL (tautan)", name: "url", widget: "string", required: false }
          - label: "Logo Footer (kanan)"
            name: "footerLogosRight"
            widget: "list"
            required: false
            fields:
              - { label: "Gambar", name: "image", widget: "image" }
              - { label: "Alt", name: "alt", widget: "string", required: false }
              - { label: "URL (tautan)", name: "url", widget: "string", required: false }
          - { label: "Body (teks isi)", name: "body", widget: "markdown", required: false }
      - file: "content/about-me/_index.md"
        label: "About Me"
        name: "aboutMe"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "content/lectures/_index.md"
        label: "Lectures"
        name: "lectures"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "content/research-grants/_index.md"
        label: "Research Grants"
        name: "researchGrants"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "content/roadmap/_index.md"
        label: "Roadmap"
        name: "roadmap"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "content/more/_index.md"
        label: "More"
        name: "more"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
